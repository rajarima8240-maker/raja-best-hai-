name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Ensure WWW and Index Exist
        run: |
          mkdir -p www
          # Agar index.html bahar hai toh use www me copy karo
          if [ -f "index.html" ]; then
            cp index.html www/
          fi
          # Agar style/js bahar hain toh unhe bhi copy karo
          cp -r *.css www/ 2>/dev/null || true
          cp -r *.js www/ 2>/dev/null || true
          # Agar tab bhi www/index.html nahi hai toh dummy fallback create karo
          if [ ! -f "www/index.html" ]; then
            echo '<!DOCTYPE html><html><body><h1>My App Running</h1></body></html>' > www/index.html
          fi
          ls -la www

      - name: Install Dependencies
        run: npm install

      - name: Add and Sync Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
