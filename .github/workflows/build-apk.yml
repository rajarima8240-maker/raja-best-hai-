name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Assets Directory
        run: |
          mkdir -p www
          # Agar index.html kisi bhi naam ya subfolder me ho, use www/ me copy karein
          find . -maxdepth 2 -iname "index.html" -exec cp {} www/index.html \;
          find . -maxdepth 2 -iname "index.htm" -exec cp {} www/index.html \;
          
          # Agar style ya js files hain unhe bhi copy karein
          cp -v *.css www/ 2>/dev/null || true
          cp -v *.js www/ 2>/dev/null || true
          cp -v -r assets www/ 2>/dev/null || true
          cp -v -r images www/ 2>/dev/null || true

          # Check karein ki www me index.html bani ya nahi
          ls -la www/

      - name: Install Dependencies
        run: npm install

      - name: Initialize Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Save APK File
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
